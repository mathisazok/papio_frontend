<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Papio — Se connecter</title>
<link rel="icon" href="assets/favicon_final.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="app-page">
<div class="signup-shell">

  <div class="signup-left">
    <a href="dashboard.html"><img class="signup-logo" src="assets/logo_final.png" alt="Papio"></a>
    <div class="signup-form-wrap">
      <div class="signup-card">
        <h1>Se connecter</h1>
        <p class="sub">Contente de vous revoir sur Papio</p>

        <button class="btn-google" type="button">
          <svg width="15" height="15" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.5-5.2l-6.2-5.2C29.2 35.4 26.7 36 24 36c-5.2 0-9.7-3.1-11.3-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.2 5.2C40.3 36.5 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Continuer avec Google
        </button>

        <div class="form-divider">or</div>

        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input class="form-input" type="email" id="loginEmail" placeholder="you@example.com" required>
          </div>

          <div class="form-group" style="margin-top:12px;">
            <label>Mot de passe</label>
            <input class="form-input" type="password" id="loginPassword" placeholder="••••••••" required>
          </div>

          <p class="form-error" id="loginError" style="display:none;"></p>

          <button class="btn-soft" type="submit" style="margin-top:16px;">Se connecter</button>
        </form>

        <p class="signup-foot">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
      </div>
    </div>
  </div>

  <div class="signup-right">
    <img class="signup-right-bg" src="assets/hero_bg.jpg" alt="">
    <div class="signup-right-fade"></div>
    <div class="signup-pill">
      Where ideas come alive
      <span class="dot"><img src="assets/icon_send_circle.svg"></span>
    </div>
  </div>

</div>

<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
