<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papio — Dashboard</title>
<link rel="icon" href="assets/favicon_final.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="app-page">

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-sidebar-top">
      <img class="app-logo-mark" src="assets/logo_mark.png" alt="Papio">
      <button class="icon-btn" type="button" aria-label="Réduire le menu">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.3"/><line x1="6.3" y1="3.5" x2="6.3" y2="12.5" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>

    <div class="app-search">
      <input type="text" placeholder="Search">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/><line x1="10.8" y1="10.8" x2="14" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </div>

    <nav class="app-nav">
      <a class="app-nav-item active" href="dashboard.html">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 7.2L8 2l6 5.2V13.5a.9.9 0 0 1-.9.9H2.9a.9.9 0 0 1-.9-.9V7.2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.2 14.4v-4.2h3.6v4.2" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="app-nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="2" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="9" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>Modèles</span>
      </a>
      <a class="app-nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M2 8h12M8 2c1.8 1.7 1.8 10.3 0 12M8 2C6.2 3.7 6.2 12.3 8 14" stroke="currentColor" stroke-width="1.1"/></svg>
        <span>Tes Site Web</span>
      </a>
    </nav>

    <div class="app-sidebar-bottom">
      <div class="upgrade-box">
        <div class="upgrade-box-head">
          <span>Upgrade</span>
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1.5l1.4 4.3 4.4.1-3.5 2.7 1.3 4.2L8 10.3l-3.6 2.5 1.3-4.2-3.5-2.7 4.4-.1L8 1.5Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
        </div>
        <p>Passer à la version supérieure</p>
      </div>
      <a class="app-nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="3.5" width="13" height="9" rx="1.6" stroke="currentColor" stroke-width="1.3"/><line x1="1.5" y1="6.3" x2="14.5" y2="6.3" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>Tarifs</span>
      </a>
      <a class="app-nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.2 3.8l-1.1 1.1M4.9 11.1l-1.1 1.1M12.2 12.2l-1.1-1.1M4.9 4.9 3.8 3.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span>Paramètres</span>
      </a>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-topbar">
      <button class="btn-upgrade-plan" type="button">Upgrade Plan</button>
      <div class="app-topbar-right">
        <button class="icon-btn" type="button" aria-label="Notifications">
          <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 2.3c-2.2 0-3.9 1.8-3.9 3.9v2.1c0 .5-.2 1-.5 1.4l-.8 1c-.5.6-.1 1.5.7 1.5h9c.8 0 1.2-.9.7-1.5l-.8-1c-.3-.4-.5-.9-.5-1.4V6.2c0-2.1-1.7-3.9-3.9-3.9Z" stroke="currentColor" stroke-width="1.2"/><path d="M7.4 14.5a1.7 1.7 0 0 0 3.2 0" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <img class="app-avatar" src="assets/avatar_generic.png" alt="Profil">
        <svg class="chevron" viewBox="0 0 16 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.6842 9.73875C7.8806 9.88894 8.1704 9.87806 8.35347 9.70644L11.6868 6.58144C11.8821 6.39837 11.8821 6.10164 11.6868 5.91858C11.4915 5.73553 11.1751 5.73553 10.9798 5.91858L7.99993 8.71219L5.02015 5.91858C4.82488 5.73553 4.50837 5.73553 4.31311 5.91858C4.11785 6.10164 4.11785 6.39837 4.31311 6.58144L7.64647 9.70644L7.6842 9.73875Z" fill="currentColor"/></svg>
      </div>
    </header>

    <div class="app-content">
      <h1>Prêt à donner vie à votre idée ?</h1>

      <!-- GenerationBox : composant partagé avec la Home (.search-card) -->
      <div class="search-card">
        <textarea class="placeholder" placeholder="Demandez à Lovable de créer une page de destination pour mon..."></textarea>
        <div class="card-bottom-row">
          <img class="attach" src="assets/icon_attach_hero.svg">
          <span class="spacer"></span>
          <div class="create-dd">
            <button type="button" class="create-dd-btn"><span class="create-dd-label">Ton site</span><img class="create-dd-chevron" src="assets/icon_lang_chevron.svg"></button>
            <div class="create-dd-menu">
              <div class="create-dd-item active" data-value="site">Ton site</div>
              <div class="create-dd-item" data-value="idee">Ton idée</div>
            </div>
          </div>
          <a class="go">Commencer</a>
        </div>
      </div>

      <div class="templates-section">
        <h2>Templates</h2>
      </div>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
