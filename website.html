<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papio — Website</title>
<link rel="icon" href="assets/favicon_final.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="app-page">

<div class="ws-shell">
  <aside class="icon-sidebar">
    <img class="app-logo-mark" src="assets/logo_mark.png" alt="Papio">
    <nav>
      <button class="icon-btn active" type="button" aria-label="Site web">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M2 8h12M8 2c1.8 1.7 1.8 10.3 0 12M8 2C6.2 3.7 6.2 12.3 8 14" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Statistiques">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M5.3 10.5v-2M8 10.5v-4M10.7 10.5v-6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Modèles">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="3" width="12" height="8.5" rx="1.6" stroke="currentColor" stroke-width="1.3"/><circle cx="6.3" cy="12.7" r="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M13.3 13.7l-1.4-1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Partage">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="4" cy="8" r="1.8" stroke="currentColor" stroke-width="1.2"/><circle cx="12.5" cy="3.7" r="1.8" stroke="currentColor" stroke-width="1.2"/><circle cx="12.5" cy="12.3" r="1.8" stroke="currentColor" stroke-width="1.2"/><path d="M5.6 7.2l5.3-3M5.6 8.8l5.3 3" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
    </nav>
    <div class="icon-sidebar-bottom">
      <button class="icon-btn" type="button" aria-label="Paramètres">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.2 3.8l-1.1 1.1M4.9 11.1l-1.1 1.1M12.2 12.2l-1.1-1.1M4.9 4.9 3.8 3.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </aside>

  <div class="ws-main">
    <header class="ws-topbar">
      <div class="ws-breadcrumb" id="breadcrumbToggle">
        Landing page pour Hotel 4 étoiles
        <svg viewBox="0 0 16 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.6842 9.73875C7.8806 9.88894 8.1704 9.87806 8.35347 9.70644L11.6868 6.58144C11.8821 6.39837 11.8821 6.10164 11.6868 5.91858C11.4915 5.73553 11.1751 5.73553 10.9798 5.91858L7.99993 8.71219L5.02015 5.91858C4.82488 5.73553 4.50837 5.73553 4.31311 5.91858C4.11785 6.10164 4.11785 6.39837 4.31311 6.58144L7.64647 9.70644L7.6842 9.73875Z" fill="currentColor"/></svg>
      </div>
      <div class="ws-topbar-tools">
        <button class="icon-btn" type="button" aria-label="Générer">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 2l1 2.3L11.3 5 9 6l-1 2.3L7 6 4.7 5 7 4.3 8 2Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><path d="M3.2 9.5l.6 1.3 1.3.6-1.3.6-.6 1.3-.6-1.3-1.3-.6 1.3-.6.6-1.3Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><path d="M12.3 8.8l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7.7-1.6Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Message">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="3.5" width="12" height="9" rx="1.6" stroke="currentColor" stroke-width="1.2"/><path d="M2.6 4.3 8 8.3l5.4-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="ws-topbar-right">
        <button class="btn-outline" id="btnPartager" type="button">Partager</button>
        <button class="btn-primary" id="btnPublier" type="button">Publier</button>
        <img class="ws-avatar" src="assets/avatar_generic.png" alt="Arthur">
      </div>

      <!-- Popup : Partager votre site web -->
      <div class="ws-popup" id="popupShare">
        <h3>Partager votre site web</h3>
        <label>Link</label>
        <div class="ws-field">
          <input type="text" value="yourwebsite/papio.io" readonly>
          <button class="copy-btn" type="button">
            Copy
            <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4.5" y="4.5" width="8" height="8" rx="1.3" stroke="currentColor" stroke-width="1.1"/><path d="M2.5 9.5V2.9A1.4 1.4 0 0 1 3.9 1.5h6.1" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
        </div>
        <label class="team-label">Team</label>
        <div class="ws-team-row">
          <img src="assets/avatar_generic.png" alt="Arthur">
          <div class="who">
            <div class="name">Arthur</div>
            <div class="mail">arthur.papio@contact.com</div>
          </div>
          <div class="role">Owner</div>
        </div>
      </div>

      <!-- Popup : Pas Publié -->
      <div class="ws-popup" id="popupPublish">
        <h3>Pas Publié</h3>
        <label>Site Url <a href="#">+ Add domain</a></label>
        <div class="ws-field">
          <input type="text" value="yourwebsite/papio.io" readonly>
          <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:12px;height:12px;"><path d="M9.7 1.8l2.5 2.5-7.6 7.6-3 .5.5-3 7.6-7.6Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </header>

    <div class="ws-body">
      <aside class="ws-chat">
        <div class="ws-chat-messages">
          <div class="chat-bubble">Créer une LP pour un étoile 4 étoiles avec ces infos de Google maps</div>
          <div class="chat-thinking">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1.8v2.4M8 11.8v2.4M14.2 8h-2.4M4.2 8H1.8M12.2 3.8l-1.7 1.7M5.5 10.5l-1.7 1.7M12.2 12.2l-1.7-1.7M5.5 5.5 3.8 3.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            En cours de réflexion . . .
          </div>
        </div>
        <div class="chat-input">
          <textarea placeholder="Demandez à Papio..."></textarea>
          <div class="chat-input-actions">
            <button class="icon-btn" type="button" aria-label="Ajouter">
              <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="7" y1="1.5" x2="7" y2="12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="1.5" y1="7" x2="12.5" y2="7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
            <span class="spacer"></span>
            <button class="btn-menu" type="button">
              Créer
              <svg viewBox="0 0 16 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.6842 9.73875C7.8806 9.88894 8.1704 9.87806 8.35347 9.70644L11.6868 6.58144C11.8821 6.39837 11.8821 6.10164 11.6868 5.91858C11.4915 5.73553 11.1751 5.73553 10.9798 5.91858L7.99993 8.71219L5.02015 5.91858C4.82488 5.73553 4.50837 5.73553 4.31311 5.91858C4.11785 6.10164 4.11785 6.39837 4.31311 6.58144L7.64647 9.70644L7.6842 9.73875Z" fill="currentColor"/></svg>
            </button>
            <button class="chat-send" type="button" aria-label="Envoyer">
              <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 11.5V2.5M7 2.5L3 6.5M7 2.5l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <main class="ws-canvas">
        <div class="ws-canvas-inner"></div>
      </main>
    </div>

    <div class="ws-floating-pill">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1.8v2.4M8 11.8v2.4M14.2 8h-2.4M4.2 8H1.8M12.2 3.8l-1.7 1.7M5.5 10.5l-1.7 1.7M12.2 12.2l-1.7-1.7M5.5 5.5 3.8 3.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Construction de votre offre
    </div>
  </div>
</div>

<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
