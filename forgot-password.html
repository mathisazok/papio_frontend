<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papio — Mot de passe oublié</title>
<link rel="icon" href="assets/favicon_final.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-page">
<div class="signup-shell">

  <div class="signup-left">
    <a href="index.html"><img class="signup-logo" src="assets/logo_final.png" alt="Papio"></a>
    <div class="signup-form-wrap">
      <div class="signup-card" id="requestCard">
        <h1>Mot de passe oublié</h1>
        <p class="sub">Entrez votre email, on vous envoie un lien de réinitialisation</p>

        <form id="forgotForm">
          <div class="form-group">
            <label>Email</label>
            <input class="form-input" type="email" id="forgotEmail" placeholder="you@example.com" required>
          </div>

          <p class="form-error" id="forgotError" style="display:none;"></p>

          <button class="btn-soft" type="submit" style="margin-top:16px;">Envoyer le lien</button>
        </form>

        <p class="signup-foot">Vous vous souvenez de votre mot de passe ? <a href="login.html">Se connecter</a></p>
      </div>

      <div class="signup-card" id="sentCard" style="display:none; text-align:center;">
        <div class="state-icon" style="margin:0 auto 18px;">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16v12H4V6Z" stroke="currentColor" stroke-width="1.4"/><path d="m4.5 6.5 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.4"/></svg>
        </div>
        <h1>Email envoyé</h1>
        <p class="sub" id="sentSub">Un lien de réinitialisation a été envoyé.</p>
        <a class="btn-soft" id="devResetLink" style="display:block; text-align:center; margin-top:16px;">Ouvrir le lien de réinitialisation</a>
        <p class="signup-foot" style="margin-top:20px;"><a href="login.html">Retour à la connexion</a></p>
      </div>
    </div>
  </div>

  <div class="signup-right">
    <img class="signup-right-bg" src="assets/hero_bg.jpg" alt="">
    <div class="signup-right-fade"></div>
    <div class="signup-pill">
      Where ideas come alive
      <span class="dot"><img src="assets/icon_send_circle.svg"></span>
    </div>
  </div>

</div>

<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script>
(function(){
  PapioAuth.redirectIfAuthenticated();
  var form = document.getElementById('forgotForm');
  var errorEl = document.getElementById('forgotError');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('forgotEmail').value.trim();
    var result = PapioAuth.requestPasswordReset(email);
    if(!result.ok){
      errorEl.textContent = result.error;
      errorEl.style.display = 'block';
      return;
    }
    document.getElementById('requestCard').style.display = 'none';
    document.getElementById('sentCard').style.display = 'block';
    document.getElementById('sentSub').textContent = 'Un lien de réinitialisation a été envoyé à ' + email + '.';
    // Pas de serveur d'email réel ici : le lien est fourni directement pour la démo.
    document.getElementById('devResetLink').href = 'reset-password.html?token=' + encodeURIComponent(result.token);
  });
})();
</script>
</body>
</html>
